name: Bake PDF (Shunn manuscript format)

on:
  workflow_dispatch:
    inputs:
      a4:
        description: "A4 paper instead of US Letter"
        type: boolean
        default: false
      title_page:
        description: "Novel format: separate title page"
        type: boolean
        default: false
      classic:
        description: "Shunn Classic: monospace, underlined emphasis"
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Pandoc, XeLaTeX and a Times-metric font
      #    Liberation Serif / Mono stand in for Times New Roman / Courier New;
      #    bake_book_pdf.sh probes for whichever is present.
      #    texlive-plain-generic is where Ubuntu puts ulem.sty, which
      #    shunn.latex loads for Classic underlining. Without it: no PDF.
      - name: Install Pandoc and TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-fonts-recommended \
            fonts-liberation \
            poppler-utils

      # 3. Bake the manuscript — one PDF per folder in manuscript/
      - name: Bake PDF
        run: |
          chmod +x pdf/bake_book_pdf.sh
          ARGS=(--auto)
          [[ "${{ inputs.a4 }}" == "true" ]]         && ARGS+=(--a4)
          [[ "${{ inputs.title_page }}" == "true" ]] && ARGS+=(--title-page)
          [[ "${{ inputs.classic }}" == "true" ]]    && ARGS+=(--classic)
          for dir in manuscript/*/; do
            pdf/bake_book_pdf.sh "${ARGS[@]}" --lang="$(basename "$dir")"
          done
        shell: bash

      # 4. Sanity check, on every PDF. Assert real structure rather than "a #
      #    appears somewhere": a manuscript that came out as one page did not
      #    build, and the Shunn running header ("Surname / Keyword / Page") is
      #    on every page of a correct build regardless of whose book it is.
      #
      #    Note the end marker is NOT greppable -- \theend spaces its three
      #    hashes with \hspace, so pdftotext puts each on its own line.
      - name: Verify output
        run: |
          for PDF in versions/*_manuscript*.pdf; do
            echo "Checking $PDF"
            pdfinfo "$PDF"
            PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
            [ "$PAGES" -ge 2 ] || { echo "Only $PAGES page(s) — build looks wrong"; exit 1; }
            pdftotext "$PDF" - | grep -qE '^.+ / .+ / [0-9]+$' \
              || { echo "No Shunn running header found in $PDF"; exit 1; }
          done
        shell: bash

      # 5. Keep the build available even when not tagged
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: versions/*_manuscript*.pdf

      # 6. Attach to the GitHub Release (if tagged)
      - name: Upload PDF to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: versions/*_manuscript*.pdf
