# =============================================================================
# Everything that makes this book yours lives in this file.
#
# The build scripts read it on every run, so changing a value here changes the
# EPUB, the PDF and the output filenames at once. There is no second place to
# keep in sync.
#
# More than one language? Each lives in manuscript/<code>/, and a book.yaml
# there overrides any key below for that language only — the title, the blurb,
# the identifier. See "Another language" in README.md.
#
# The one exception is index.html, which GitHub Pages serves as a static file
# and so cannot read anything at build time. ./setup.sh fills that in once.
# =============================================================================

# --- Identity ----------------------------------------------------------------
# Shared by every language. Each manuscript/<code>/book.yaml overrides title,
# description, slug and identifier with its own.
title:       "De Romance van Artemis en Callisto"
byline:      "F. J. S. Remmelzwaal"         # as it appears on the PDF cover sheet
author-sort: "Remmelzwaal, Floortje J. S."  # library sort order, for the EPUB
description: "Een mythische romance tussen de godin Artemis en de nimf Callisto."
rights:      "© 2026 F. J. S. Remmelzwaal"
publisher:   "self-published"

# The book's original language: a manuscript/<code>/ folder. Its edition uses
# the identifier below; every other language needs its own.
lang:        "nl"

# Which languages a build publishes, when you don't pass --lang: a tagged
# release, a manual Actions run with the languages box empty, or a local
# build. Leave it out to build every folder in manuscript/.
# publish: [nl]

# Output filenames are built from this. Keep it filesystem-safe: no spaces,
# no slashes.  ->  versions/Artemis_en_Callisto_v1.0.0_nl.epub
slug:        "Artemis_en_Callisto"

# A unique, permanent id for the EPUB — see "The identifier" in README.md.
# This one belongs to the default language (nl). Never copy another book's
# identifier: e-readers use it to tell books apart. A translation is another
# book, so it needs its own too.
identifier:  "urn:uuid:ad861c7d-dbc6-4086-b04e-80b3228d7fd1"

# --- Running header (Shunn format: "Surname / Keyword / Page") ----------------
surname:     "Remmelzwaal"
shorttitle:  "Artemis"

# --- Where it lives ----------------------------------------------------------
github:
  owner: "fluxpiada"
  repo:  "artemis_callisto"

# The cover the EPUB shows: the painting with title and author on it, made by
# epub/make_cover.py from cover-art. Each language has its own, because the
# title differs. See "The cover" in README.md.
cover:     "images/cover_nl.jpg"
cover-art: "images/artemis_callisto_boucher.jpg"

# --- Words the build writes into your book -----------------------------------
# Translate these in manuscript/<code>/book.yaml for another language.
wordcount-text: "ongeveer %s woorden"  # PDF cover sheet; %s is the rounded count
# thousands-separator: "."          # the count's 1,000 / 1.000 / 1 000 — set
#                                   # from the language; only override if wrong
edition-text:   "Huidige editie"       # last line of the EPUB's release history
contents-text:  "Inhoud"               # heading of the EPUB's contents page

# --- The PDF cover sheet -----------------------------------------------------
# Shunn puts your contact details in the upper-left of page one: legal name,
# address, phone, email. Fill the bracketed lines in before submitting
# anywhere. Do NOT add a tax or national insurance number.
contact:
  - "Floortje J. S. Remmelzwaal"
  - "[street and number]"
  - "[postcode] Arnhem"
  - "The Netherlands"
  - "[phone]"
  - "[email]"

# THE FONT. Any family installed on your machine; the name must match exactly.
# List what you have with:  pdf/bake_book_pdf.sh --list-fonts
# Leave commented out for the automatic fallback chain (Times New Roman
# locally, Liberation Serif on CI). Shunn asks for a plain serif at 12pt.
# mainfont: "Times New Roman"

# --- How the PDF filter treats two ambiguous constructs ----------------------
# Both default to off, because both silently change how your text renders.
shunn:
  # Fenced code blocks become centred "screen text" instead of code. Turn this
  # on only if your book has no real code samples in it — with it on, a pasted
  # shell transcript loses its indentation.
  machinetext: false

  # Rebuild scene dividers that pandoc misread as a definition list. Only
  # needed if you write dividers as a bare "~ * ~" with no "##" in front.
  # The supported form is "## ~ * ~", which never needs this.
  repair_dividers: false
